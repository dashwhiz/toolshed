<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolshed — small developer utilities</title>
    <meta
      name="description"
      content="Small developer utilities. Single static pages, no backend, everything runs in your browser."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/toolshed.css" />
  </head>
  <body>
    <main>
      <h1>Toolshed</h1>
      <p class="lede">
        One place to answer “is this real, and what is it?” — without googling a tool, finding a
        site, and pasting your URL into it. Nothing you paste leaves your browser.
      </p>
      <div id="groups"></div>
    </main>

    <script type="module">
      import { icon, renderFooter } from "./assets/toolshed.js";

      // Mirrors ROADMAP.md. Flip `built` to true when a tool ships.
      const GROUPS = [
        {
          name: "Check something out there",
          note: "Looks things up over the network. No keys, no accounts.",
          tools: [
            { slug: "site-check", name: "Website trust check", blurb: "Domain age, registrar, DNS and host — with the red flags named", built: true },
            { slug: "dns", name: "DNS records", blurb: "A, MX, NS, TXT, CAA over DNS-over-HTTPS", built: false },
            { slug: "email-auth", name: "Email spoofability", blurb: "SPF, DMARC and DKIM — can mail be forged from this domain?", built: false },
            { slug: "ip", name: "IP & ASN lookup", blurb: "Who owns this address, and where does it sit?", built: false },
          ],
        },
        {
          name: "Inspect something you were sent",
          note: "Fully offline. Nothing is uploaded, ever.",
          tools: [
            { slug: "link", name: "Link inspector", blurb: "Homograph domains, wrapped safelinks, tracking params", built: false },
            { slug: "unicode", name: "Hidden characters", blurb: "Zero-width, homoglyphs, smart quotes, non-breaking spaces", built: false },
            { slug: "jwt", name: "JWT decoder", blurb: "Decode a token without pasting it into a website", built: false },
            { slug: "cert", name: "Certificate decoder", blurb: "Issuer, subject, SANs and validity from a PEM", built: false },
            { slug: "injection-scan", name: "Prompt injection scan", blurb: "Hidden text and buried instructions, before you point an agent at it", built: false },
          ],
        },
        {
          name: "Everyday utilities",
          tools: [
            { slug: "timestamp", name: "Timestamp converter", blurb: "Epoch ⇄ human, timezone aware", built: false },
            { slug: "ids", name: "ID generator", blurb: "UUID v4, ULID, nanoid — in bulk", built: false },
            { slug: "hash", name: "Hash generator", blurb: "SHA-1, SHA-256, SHA-512 via WebCrypto", built: false },
            { slug: "encode", name: "Encode/decode bench", blurb: "Base64, URL and HTML entities", built: false },
            { slug: "text", name: "Text bench", blurb: "Case convert, sort, dedupe, trim, count", built: false },
            { slug: "contrast", name: "Colour contrast", blurb: "WCAG AA/AAA, with the nearest passing shade", built: false },
            { slug: "cron", name: "Cron explainer", blurb: "Plain English, plus the next five run times", built: false },
          ],
        },
      ];

      const groups = document.getElementById("groups");

      for (const group of GROUPS) {
        const heading = document.createElement("p");
        heading.className = "label";
        heading.textContent = group.name;
        groups.append(heading);

        if (group.note) {
          const note = document.createElement("p");
          note.className = "label-note";
          note.textContent = group.note;
          groups.append(note);
        }

        const list = document.createElement("ul");
        list.className = "grid";

        for (const tool of group.tools) {
          const card = document.createElement(tool.built ? "a" : "div");
          card.className = tool.built ? "card" : "card card--pending";
          if (tool.built) card.href = `tools/${tool.slug}/`;

          const name = document.createElement("strong");
          name.className = "card-name";
          name.textContent = tool.name;

          const state = document.createElement("span");
          state.className = "card-state";
          state.textContent = tool.built ? "open" : "soon";
          // Only a tool you can actually open earns an icon; fifteen clocks is noise.
          if (tool.built) state.append(icon("arrow-right"));

          const head = document.createElement("span");
          head.className = "card-head";
          head.append(name, state);

          const blurb = document.createElement("span");
          blurb.className = "card-blurb";
          blurb.textContent = tool.blurb;

          card.append(head, blurb);
          const li = document.createElement("li");
          li.append(card);
          list.append(li);
        }
        groups.append(list);
      }

      renderFooter();
    </script>
  </body>
</html>
